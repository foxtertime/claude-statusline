name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Ручной запуск для уже существующего тега: публикует релиз, если его нет,
  # иначе обновляет его описание из CHANGELOG.md.
  workflow_dispatch:
    inputs:
      tag:
        description: Существующий тег, например v1.2.3
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the tag name
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      # Scripts live in src/; tags up to v1.3.0 have them in the root, and the
      # workflow can be re-run for an existing tag.
      - name: Find the scripts
        run: |
          if [ -f src/statusline.sh ]; then dir=src; else dir=.; fi
          echo "SRC=$dir" >> "$GITHUB_ENV"
      - name: Check that the tag matches VERSION
        run: |
          version=$("$SRC/statusline.sh" --version | cut -d' ' -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match VERSION $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: ./tests/run.sh
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      # install.sh, запущенный без копии репозитория, скачивает statusline.sh
      # отсюда и сверяет его с SHA256SUMS. Имена файлов в релизе — без src/.
      - name: Attach the scripts and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$SRC"
          sha256sum statusline.sh install.sh > "$RUNNER_TEMP/SHA256SUMS"
          gh release upload "$TAG" statusline.sh install.sh "$RUNNER_TEMP/SHA256SUMS" --clobber
